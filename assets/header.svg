<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Ruffianjiang banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1437"/>
      <stop offset="50%" stop-color="#123a6b"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <!-- pipeline / network motif -->
  <g stroke="#7dd3fc" stroke-opacity="0.18" stroke-width="1.5" fill="none">
    <path d="M70 290 L250 190 L430 250 L610 150 L810 230 L990 130 L1150 210"/>
  </g>
  <g fill="#7dd3fc" fill-opacity="0.35">
    <circle cx="70" cy="290" r="5"/>
    <circle cx="250" cy="190" r="5"/>
    <circle cx="430" cy="250" r="5"/>
    <circle cx="610" cy="150" r="5"/>
    <circle cx="810" cy="230" r="5"/>
    <circle cx="990" cy="130" r="5"/>
    <circle cx="1150" cy="210" r="5"/>
  </g>

  <text x="600" y="168" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="72" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">Ruffianjiang</text>
  <rect x="430" y="192" width="340" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="600" y="246" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#cbd5e1" text-anchor="middle">全栈工程师 · 技术管理者</text>
  <text x="600" y="288" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#93c5fd" text-anchor="middle">工业智能平台 · 大数据与实时计算 · 云原生与 DevOps</text>
</svg>
