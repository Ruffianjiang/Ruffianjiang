<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-label="技术栈熟练度">
  <defs>
    <linearGradient id="skBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1437"/>
      <stop offset="55%" stop-color="#123a6b"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="skBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="330" rx="14" fill="url(#skBg)"/>

  <text x="32" y="46" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#ffffff">技术栈熟练度</text>
  <rect x="32" y="58" width="86" height="4" rx="2" fill="url(#skBar)"/>

  <!-- 轨道 + 进度条：label / track / fill / percent -->
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <!-- Java 95% -->
    <text x="32" y="98" font-size="15" fill="#e2e8f0">Java</text>
    <rect x="160" y="87" width="540" height="13" rx="6.5" fill="#1e293b" fill-opacity="0.75"/>
    <rect x="160" y="87" width="513" height="13" rx="6.5" fill="url(#skBar)"/>
    <text x="712" y="99" font-size="13" fill="#93c5fd">95%</text>

    <!-- Spring Boot 90% -->
    <text x="32" y="130" font-size="15" fill="#e2e8f0">Spring Boot</text>
    <rect x="160" y="119" width="540" height="13" rx="6.5" fill="#1e293b" fill-opacity="0.75"/>
    <rect x="160" y="119" width="486" height="13" rx="6.5" fill="url(#skBar)"/>
    <text x="712" y="131" font-size="13" fill="#93c5fd">90%</text>

    <!-- SQL / 数据仓库 88% -->
    <text x="32" y="162" font-size="15" fill="#e2e8f0">SQL / 数据仓库</text>
    <rect x="160" y="151" width="540" height="13" rx="6.5" fill="#1e293b" fill-opacity="0.75"/>
    <rect x="160" y="151" width="475" height="13" rx="6.5" fill="url(#skBar)"/>
    <text x="712" y="163" font-size="13" fill="#93c5fd">88%</text>

    <!-- Python 85% -->
    <text x="32" y="194" font-size="15" fill="#e2e8f0">Python</text>
    <rect x="160" y="183" width="540" height="13" rx="6.5" fill="#1e293b" fill-opacity="0.75"/>
    <rect x="160" y="183" width="459" height="13" rx="6.5" fill="url(#skBar)"/>
    <text x="712" y="195" font-size="13" fill="#93c5fd">85%</text>

    <!-- Redis 80% -->
    <text x="32" y="226" font-size="15" fill="#e2e8f0">Redis</text>
    <rect x="160" y="215" width="540" height="13" rx="6.5" fill="#1e293b" fill-opacity="0.75"/>
    <rect x="160" y="215" width="432" height="13" rx="6.5" fill="url(#skBar)"/>
    <text x="712" y="227" font-size="13" fill="#93c5fd">80%</text>

    <!-- Vue 3 / 前端工程 78% -->
    <text x="32" y="258" font-size="15" fill="#e2e8f0">Vue 3 / 前端</text>
    <rect x="160" y="247" width="540" height="13" rx="6.5" fill="#1e293b" fill-opacity="0.75"/>
    <rect x="160" y="247" width="421" height="13" rx="6.5" fill="url(#skBar)"/>
    <text x="712" y="259" font-size="13" fill="#93c5fd">78%</text>

    <!-- Flink / Doris 72% -->
    <text x="32" y="290" font-size="15" fill="#e2e8f0">Flink / Doris</text>
    <rect x="160" y="279" width="540" height="13" rx="6.5" fill="#1e293b" fill-opacity="0.75"/>
    <rect x="160" y="279" width="389" height="13" rx="6.5" fill="url(#skBar)"/>
    <text x="712" y="291" font-size="13" fill="#93c5fd">72%</text>

    <!-- Docker / K8s 68% -->
    <text x="32" y="320" font-size="15" fill="#e2e8f0">Docker / K8s</text>
    <rect x="160" y="309" width="540" height="13" rx="6.5" fill="#1e293b" fill-opacity="0.75"/>
    <rect x="160" y="309" width="367" height="13" rx="6.5" fill="url(#skBar)"/>
    <text x="712" y="321" font-size="13" fill="#93c5fd">68%</text>
  </g>
</svg>
